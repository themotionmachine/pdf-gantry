[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-gantry"
version = "0.1.0"
description = "Agent-friendly CLI for managing academic PDF libraries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
gantry = "pdf_gantry.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["pdf_gantry"]
